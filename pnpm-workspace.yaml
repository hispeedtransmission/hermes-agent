packages:
  - apps/*
  - ui-tui
  - ui-tui/packages/*
  - web
  - tests-js
allowBuilds:
  electron-winstaller@5.4.0: true
  electron@43.7.0: true
  esbuild@0.28.1: true
  fsevents@2.3.2: true
  fsevents@2.3.3: true
  get-windows@9.3.0: true
  lefthook@2.1.14: true
  node-pty@1.1.0: true
  unicode-animations: false
engineStrict: true
linkWorkspacePackages: true
minimumReleaseAge: 20160
minimumReleaseAgeExclude:
  # Reviewed security fixes; exact exceptions, never a global age bypass.
  - '@simple-git/argv-parser@2.0.1'
  - 'http-cache-semantics@4.3.0'
  - 'shell-quote@1.11.0'
  - 'source-map-js@1.2.2'
  - '@assistant-ui/*'
  - assistant-cloud
  - assistant-stream
  - '@radix-ui/*'
  - radix-ui
  - safe-content-frame
  - react-router
  - eslint
  - '@eslint/*'
  - tar
  - concurrently
  - fast-uri
  - minimatch
  - brace-expansion
  - js-yaml
  - nanoid
  - mermaid
  - dompurify
  - vite
  - rolldown
  - '@rolldown/*'
  - '@oxc-project/types'
  - lightningcss
  - postcss
overrides:
  '@electron/osx-sign>isbinaryfile': 5.0.7
  brace-expansion: 5.0.12
  dompurify: 3.4.16
  ip-address: 10.7.1
  js-yaml@^4: 4.3.2
  lodash: 4.18.1
  mermaid: 11.16.1
  nanoid@^3: 3.3.18
  nanoid@^6: 6.0.0
  postcss: 8.5.23
  protobufjs: ^8.7.1
  tar: 7.5.22
  undici@^6: 6.28.1
  undici@^7: 7.29.1
  yauzl: ^3.3.1
  "@simple-git/argv-parser": 2.0.1
  "@xmldom/xmldom@^0.8": 0.8.15
  "@xmldom/xmldom@^0.9": 0.9.12
  "axios": 1.20.0
  "fast-uri@^3": 3.1.8
  "http-cache-semantics": 4.3.0
  "joi": 18.2.9
  "katex": 0.18.2
  "postcss-selector-parser": 7.1.6
  "shell-quote": 1.11.0
  "source-map-js": 1.2.2
patchedDependencies:
  http-cache-semantics@4.3.0: patches/http-cache-semantics@4.3.0.patch
publicHoistPattern:
  - '*'
