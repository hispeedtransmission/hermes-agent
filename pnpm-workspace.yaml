# Isolated security candidate; see DEPENDENCY-REMEDIATION.md before deployment.
packages:
  - 'apps/*'
  - 'ui-tui'
  - 'ui-tui/packages/*'
  - 'web'
  - 'tests-js'
nodeLinker: hoisted
minimumReleaseAge: 1440
allowBuilds:
  unicode-animations: false
  esbuild: true
  node-pty: true
  electron-winstaller: false
  electron: true
  fsevents: true
  get-windows: true
overrides:
  "lodash": "4.18.1"
  "yauzl": "^3.3.1"
  "protobufjs": "^8.7.1"
  "brace-expansion": "5.0.9"
  "mermaid": "11.16.1"
  "dompurify": "3.4.13"
  "ip-address": "10.3.1"
  "nanoid@^3": "3.3.18"
  "nanoid@^6": "6.0.0"
  "js-yaml@^4": "4.3.1"
  "undici@^6": "6.28.0"
  "undici@^7": "7.29.0"
  "postcss": "8.5.23"
  "tar": "7.5.22"
  "browserslist@<4.28.7": "4.28.7"
  "fast-uri@>=3 <3.1.6": "3.1.6"
  "sanitize-html@<2.17.7": "2.17.7"
  "@xmldom/xmldom@>=0.8 <0.9": "0.8.15"
  "@xmldom/xmldom@>=0.9 <0.9.12": "0.9.12"
